[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentplan"
version = "0.1.0"
description = "Cost-based query planning for multi-agent orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Habib Ur Rehman" }]
keywords = ["agents", "query-optimizer", "orchestration", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/habib-analyst/agentplan"

[project.scripts]
agentplan = "agentplan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentplan*"]
